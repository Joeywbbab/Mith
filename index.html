<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Architects Daughter', 'sans-serif'],
            },
            colors: {
              border: "#e4e4e7", // zinc-200
              input: "#e4e4e7", // zinc-200
              ring: "#18181b", // zinc-900
              background: "#ffffff",
              foreground: "#18181b", // zinc-900
              primary: {
                DEFAULT: "#18181b", // zinc-900
                foreground: "#fafafa", // zinc-50
              },
              secondary: {
                DEFAULT: "#f4f4f5", // zinc-100
                foreground: "#18181b",
              },
              muted: {
                DEFAULT: "#f4f4f5",
                foreground: "#71717a", // zinc-500
              },
              accent: {
                DEFAULT: "#f4f4f5",
                foreground: "#18181b",
              },
            },
            borderRadius: {
              sm: "calc(0.625rem - 4px)",  // --radius-sm
              md: "calc(0.625rem - 2px)",  // --radius-md
              lg: "0.625rem",              // --radius-lg (--radius)
              xl: "calc(0.625rem + 4px)",  // --radius-xl
            },
            letterSpacing: {
              tighter: "calc(0.5px - 0.05em)",
              tight: "calc(0.5px - 0.025em)",
              normal: "0.5px",
              wide: "calc(0.5px + 0.025em)",
              wider: "calc(0.5px + 0.05em)",
              widest: "calc(0.5px + 0.1em)",
            },
            boxShadow: {
              '2xs': '1px 4px 5px 0px hsl(0 0% 0% / 0.01)',
              'xs': '1px 4px 5px 0px hsl(0 0% 0% / 0.01)',
              'sm': '1px 4px 5px 0px hsl(0 0% 0% / 0.03), 1px 1px 2px -1px hsl(0 0% 0% / 0.03)',
              DEFAULT: '1px 4px 5px 0px hsl(0 0% 0% / 0.03), 1px 1px 2px -1px hsl(0 0% 0% / 0.03)',
              'md': '1px 4px 5px 0px hsl(0 0% 0% / 0.03), 1px 2px 4px -1px hsl(0 0% 0% / 0.03)',
              'lg': '1px 4px 5px 0px hsl(0 0% 0% / 0.03), 1px 4px 6px -1px hsl(0 0% 0% / 0.03)',
              'xl': '1px 4px 5px 0px hsl(0 0% 0% / 0.03), 1px 8px 10px -1px hsl(0 0% 0% / 0.03)',
              '2xl': '1px 4px 5px 0px hsl(0 0% 0% / 0.07)',
            },
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar for macOS feel - Minimalist */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e4e4e7; /* zinc-200 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4d4d8; /* zinc-300 */
      }
      
      body {
        background-color: #ffffff;
        color: #09090b;
        font-feature-settings: "rlig" 1, "calt" 1;
      }
      
      /* Remove focus outline for mouse users, keep for keyboard */
      *:focus-visible {
        outline: 2px solid #18181b;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="overflow-hidden antialiased selection:bg-zinc-200 selection:text-zinc-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
